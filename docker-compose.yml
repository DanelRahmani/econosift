services:
  backend:
    build: ./backend
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    expose:
      - "8000"
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  sqlite_data:
