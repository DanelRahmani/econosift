name: CI

# Runs the test suite on every push to DEV/main and on PRs into main.
#
# Until now nothing gated the DEV -> main pull request: the backend suite only
# ran when someone remembered to run it locally. This workflow makes the tests
# that already exist actually load-bearing.
#
# The backend suite is deliberately offline — conftest.py resets both cache
# tiers per test and every service degrades to an empty result when an API key
# is absent, so no secrets are needed here. Verified by running the full suite
# with FRED/FINNHUB/GEMINI unset and a throwaway ECONOSIFT_DATA_DIR.
#
# Python is pinned to 3.12 to match backend/Dockerfile (the shipping runtime).
# build-desktop.yml uses 3.13 for the PyInstaller desktop freeze; that is a
# separate concern and intentionally not aligned here.
#
# Frontend runs `tsc --noEmit` and `next lint`. ESLint had never been
# initialised here, so `next lint` used to prompt interactively and would hang a
# runner; it now has a committed .eslintrc.json with eslint pinned to 8.x and
# eslint-config-next matched to Next 14 (9.x / 16.x both break `next lint` on
# this Next version).

on:
  push:
    branches: [DEV, main]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        working-directory: backend
        # ECONOSIFT_DATA_DIR points at a scratch path so the suite never touches a
        # developer's real SQLite volume and always starts from a clean DB.
        env:
          ECONOSIFT_DATA_DIR: ${{ runner.temp }}/econosift-data
        run: pytest -q

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        # Warnings are allowed through (mostly react-hooks/exhaustive-deps on
        # pre-existing components); errors are not.
        run: npx next lint --max-warnings=9999

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    # Slower than the other jobs: it builds and boots the whole stack. Kept
    # separate so a type error is reported in seconds rather than minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create an empty .env
        # docker-compose declares `env_file: .env` and bind-mounts it, but .env
        # is gitignored so it does not exist on a runner. Compose would fail
        # outright, and the bind mount would silently create a directory.
        run: touch .env

      - name: Start the stack
        # No API keys in CI, so every source degrades to an empty result. The
        # pages must still render their shell and panels — which is exactly the
        # regression these tests exist to catch.
        run: |
          docker compose up -d --wait --build
          docker compose ps

      - name: Start the cold World Bank trade fetch
        # /trade's exports are not in the bulk World Bank download, so on a fresh
        # volume the page waits on a live pull for ~200 countries x 3 series,
        # which alone can outlast the test's 90 s. A developer's stack serves it
        # from its warm cache. Kick it off now, in the background, so it runs
        # while dependencies and Chromium install; the test's own request joins
        # the in-flight fetch (the cache locks per key) instead of starting cold.
        # Nothing is faked: if the World Bank fails, the page still shows its
        # unavailable state, which the test accepts.
        run: nohup curl -s -o /dev/null --max-time 600 http://localhost/api/macro/trade > /dev/null 2>&1 &

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost
        run: npx playwright test

      - name: Backend logs on failure
        if: failure()
        # The whole run, not a tail: a request that hangs is logged (or not) long
        # before the last test finishes. nginx's log shows whether the browser's
        # request ever left the page (a 499 is a request the test gave up on).
        run: |
          docker compose logs --timestamps backend > stack-logs.txt
          docker compose logs --timestamps nginx >> stack-logs.txt
          tail -n 300 stack-logs.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # The reporter is `list`, so there is no playwright-report/ — the
          # retry traces and error contexts live in test-results/.
          name: playwright-traces
          path: |
            frontend/test-results/
            stack-logs.txt
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
