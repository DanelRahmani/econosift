name: CI

# Runs the test suite on every push to DEV/main and on PRs into main.
#
# Until now nothing gated the DEV -> main pull request: the backend suite only
# ran when someone remembered to run it locally. This workflow makes the tests
# that already exist actually load-bearing.
#
# The backend suite is deliberately offline — conftest.py resets both cache
# tiers per test and every service degrades to an empty result when an API key
# is absent, so no secrets are needed here. Verified by running the full suite
# with FRED/FINNHUB/GEMINI unset and a throwaway ECONOSIFT_DATA_DIR.
#
# Python is pinned to 3.12 to match backend/Dockerfile (the shipping runtime).
# build-desktop.yml uses 3.13 for the PyInstaller desktop freeze; that is a
# separate concern and intentionally not aligned here.
#
# Frontend runs `tsc --noEmit` and `next lint`. ESLint had never been
# initialised here, so `next lint` used to prompt interactively and would hang a
# runner; it now has a committed .eslintrc.json with eslint pinned to 8.x and
# eslint-config-next matched to Next 14 (9.x / 16.x both break `next lint` on
# this Next version).

on:
  push:
    # refactor/** too: the Phase 65+ refactor branches must show CI green before their PR.
    branches: [DEV, main, "refactor/**"]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        working-directory: backend
        # ECONOSIFT_DATA_DIR points at a scratch path so the suite never touches a
        # developer's real SQLite volume and always starts from a clean DB.
        env:
          ECONOSIFT_DATA_DIR: ${{ runner.temp }}/econosift-data
        run: pytest -q

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # >= 22.18 runs the TypeScript unit tests without a loader
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Lint
        working-directory: frontend
        # Warnings are allowed through (mostly react-hooks/exhaustive-deps on
        # pre-existing components); errors are not.
        run: npx next lint --max-warnings=9999

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    # Runs against the static export with /api answered from recorded fixtures
    # (tests/e2e/mock-server.mjs, tests/e2e/fixtures/api): no Docker stack, no
    # live Yahoo/FRED/World Bank, so a slow or failing upstream can no longer
    # make this job flaky. A request without a fixture fails the run. The live
    # suite against Docker stays part of each phase's local gate.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the static export
        working-directory: frontend
        env:
          # .env.production points the desktop build at :8000; the mocked suite
          # needs same-origin /api, like the Docker image (frontend/Dockerfile).
          NEXT_PUBLIC_API_URL: ""
        run: npx next build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests (mocked /api)
        working-directory: frontend
        env:
          PW_MOCK_API: "1"
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # The reporter is `list`, so there is no playwright-report/ — the
          # retry traces and error contexts live in test-results/.
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
