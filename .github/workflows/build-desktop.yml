# ─────────────────────────────────────────────────────────────────────────────
# Build Axiom Finance Desktop App — Tauri + PyInstaller + Next.js
#
# Triggers:
#   - Push to PRODUCTION branch   → build + upload artifacts (CI test)
#   - Tag v*.*.*                  → build + publish GitHub Release
#
# Matrix: windows-latest, macos-latest, ubuntu-latest
# ─────────────────────────────────────────────────────────────────────────────

name: Build Desktop App

on:
  push:
    branches: [PRODUCTION]
    tags: ["v*.*.*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_suffix: .exe
            frontend_out: out

    runs-on: ${{ matrix.os }}

    # ── 1. Install system dependencies ──────────────────────────────────
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── 2. Build Python backend → PyInstaller binary ──────────────────
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies (runtime)
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        working-directory: ./backend
        run: pip install -r requirements-build.txt

      - name: Build backend binary (PyInstaller)
        working-directory: ./backend
        run: pyinstaller build.spec

      - name: Rename binary for Tauri sidecar (target-triple suffix)
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          SRC="backend/dist/axiom-backend${{ matrix.binary_suffix }}"
          DST="desktop/src-tauri/binaries/axiom-backend-${{ matrix.target }}${{ matrix.binary_suffix }}"
          if [ ! -f "$SRC" ]; then
            echo "ERROR: PyInstaller output not found at $SRC"
            ls -la backend/dist/ || true
            exit 1
          fi
          cp "$SRC" "$DST"
          echo "Binary copied to $DST"

      # ── 3. Build frontend static export ───────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend (static export)
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      # ── 4. Build Tauri desktop app ────────────────────────────────────
      - name: Install desktop JS dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: ./desktop
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── 5. Upload installer artifacts ─────────────────────────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: axiom-finance-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      # ── 6. Release (tag push only) ────────────────────────────────────
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/latest.json
