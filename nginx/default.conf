server {
    listen 80;
    server_name _;

    # Enable gzip compression for API and frontend assets
    gzip on;
    gzip_types application/json text/plain text/css application/javascript application/x-javascript text/javascript;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # AI summaries can take 5+ min (data gathering + Gemini API call)
    location /api/ai/ {
        proxy_pass            http://backend:8000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout    360s;
        proxy_connect_timeout 10s;
        proxy_next_upstream   error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 3;
    }

    location /api/ {
        proxy_pass            http://backend:8000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout    180s;
        proxy_connect_timeout 10s;
        proxy_next_upstream   error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 3;
    }

    # P2-18: build chunks are content-hashed, so they can be cached forever ...
    location /_next/static/ {
        proxy_pass         http://frontend:3000;
        proxy_set_header   Host $host;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ... while HTML (and RSC payloads) must revalidate on every load, so a
    # redeploy's new chunk names are picked up without a hard refresh.
    location / {
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "no-cache" always;
        proxy_pass         http://frontend:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
